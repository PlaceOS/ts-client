# Checks the package: the migration map, types, tests and build.
name: CI

on:
    pull_request:
    push:
        branches:
            - master
            - next

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - run: bun install --frozen-lockfile
            - run: bun run v1-map:check
            - run: bun run check
            - run: bun test
            - run: bun run build
