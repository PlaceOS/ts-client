# Releases the package with semantic-release, from the commit messages since the last release:
#
# - `master` publishes to the npm tag `latest`, and the API docs to GitHub Pages.
# - `next` publishes prereleases, such as 7.0.0-next.1, to the npm tag `next`.
# - A maintenance branch, such as `6.x`, publishes fixes of that major version. The workflow on
#   that branch lists it in `on.push.branches`.
#
# The branches are in `release` of package.json. npm gets the package with trusted publishing
# (`id-token: write`), so the job has no npm token.
name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - master
            - next

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # semantic-release and `npm publish` run on Node.
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.10'

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun test
            # Before the release, so that a failed build does not leave a tag without a package.
            - run: bun run build

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            - uses: denoland/setup-deno@v2
              if: github.ref == 'refs/heads/master'
              with:
                  deno-version: 2.9.8

            - name: Generate the API docs
              if: github.ref == 'refs/heads/master'
              run: bun run docs

            - name: Publish the API docs to GitHub Pages
              if: github.ref == 'refs/heads/master'
              uses: peaceiris/actions-gh-pages@v4.0.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
