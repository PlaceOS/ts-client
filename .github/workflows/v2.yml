# Checks the v2 package: types, tests and build.
name: v2

on:
    pull_request:
        paths:
            - 'v2/**'
            - '.github/workflows/v2.yml'
    push:
        branches:
            - master
        paths:
            - 'v2/**'
            - '.github/workflows/v2.yml'

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: v2
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun test
            - run: bun run build
